services:
  web-viewer:
    build: .
    container_name: nepnha-web-viewer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_DRIVER=sqlite
      # - OPENAI_API_KEY=your_key_here
      # - MONGODB_URI=mongodb://mongo:27017/nepnha
    volumes:
      - ./data:/app/data

  # Optional MongoDB service (activate when DATABASE_DRIVER=mongodb)
